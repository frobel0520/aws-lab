name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Dependency audit (high/critical fails)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
